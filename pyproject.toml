[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-agent"
version = "0.1.0"
description = "A from-scratch personal agent runtime"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/nemo"]
